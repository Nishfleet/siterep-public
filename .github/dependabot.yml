version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    cooldown:
      # Owner standing rule, 2026-10-22: upstream releases are taken after
      # 3 days, not the 7 the semgrep p/default rule asks for. Same policy
      # as the github-actions entry below; deliberate, so the rule is
      # silenced on this line only.
      default-days: 3 # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:20"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    cooldown:
      # Owner standing rule, 2026-10-22: upstream releases are taken after
      # 3 days, not the 7 the semgrep p/default rule asks for. Landed in
      # PR #207; deliberate, so the rule is silenced on this line only.
      default-days: 3 # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
    commit-message:
      prefix: "deps(actions)"
