# Trigger stub. The dispatch logic lives once in Nishfleet/fleet-ops; a
# workflow only fires on its own repo's events, so the triggers stay here.
# opus-vet dispatches this file by name with issue=<N>. The task input is
# workflow_dispatch-only, so only a login with write access can set it:
# task=miss-review replays a miss review on one issue, task=orchestrate hands
# a parked issue to the orchestrator hand-off, empty is a normal sweep. The
# callee declares the same two inputs on its workflow_call (verified on
# fleet-ops main), so a dispatch with task never fails at startup.
# The job's if: mirrors the callee's own job conditions, because this file
# cannot see a moving @main: a comment event is dispatched only when the
# comment starts a miss review (park:/opus-vet:) AND its author is
# OWNER/MEMBER/COLLABORATOR, and a closed pull_request_target only when the
# callee's miss-review-pr job can act on it (same-repo head; a claim/issue-*
# close, or a merge of a GitHub-generated revert, whose title always starts
# Revert "). Any stranger's comment or a fork's PR close starts nothing.
# Every other pull_request_target action (the callee's hold-risky, ejected
# and PR sweeps use them) is dispatched only for a same-repo head, so a
# fork's PR opening, pushing or being labelled starts nothing either.
# issues: reopened dispatches the callee's miss-review for the issue; the
# callee's MISS_REVIEW variable and its Gate's one-review-per-issue dedupe
# own that decision.
name: agent-dispatch
on:
  issues:
    types: [labeled, closed, reopened]
  # A park: comment starts a miss review (fleet-ops#9211).
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to dispatch, overrides the sweep and its claim-PR append'
        required: false
        type: string
      task:
        description: 'miss-review to replay a miss on issue, orchestrate to hand a parked issue to the orchestrator, empty for a normal sweep'
        required: false
        type: string
  # All nine PR events the fleet's review and merge gates listen for:
  # https://github.com/Nishfleet/fleet-ops#intake-enrolment (precondition 3),
  # the same list as the callee's own on.pull_request_target.types. On these
  # events only the callee's PR jobs run (hold-risky and its review-risky,
  # ejected, paused, and miss-review-pr on a close); its sweep runs only on
  # issues: closed, workflow_dispatch and schedule. hold-risky reads the PR
  # through the API and labels with GITHUB_TOKEN, which starts no new run.
  # review-risky is the fleet's paid review of a held head: it reviews each
  # head once (a second event on the same head, a label included, finds the
  # verdict and stops), and it reads the head as a git diff, never running
  # its code. No PR-event job checks out or runs the head.
  pull_request_target:
    types: [dequeued, auto_merge_disabled, closed, auto_merge_enabled, synchronize, labeled, opened, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
# One running and one pending run per commented issue, and per PR and PR
# action; GitHub replaces the pending run, so a burst of comments, pushes or
# labels cannot fan out. Actions get separate groups on purpose: a new
# head's synchronize must reach hold-risky at once, never wait behind a
# long review-risky run of the old head. Parallel runs on one PR are safe
# because the callee serialises its own PR work: hold-risky in a per-PR
# group that queues, and the review in a per-PR group where the newer run
# replaces the older, after which the verdict check stops a second review
# of the same head. Nothing here is cancelled mid-run, so a callee job
# never stops between two writes; the callee reads the PR's current state,
# so a replaced pending run loses nothing. A PR close and every other event
# get their own group and never queue (the callee owns the sweep's own
# group). Every group here is prefixed so it never equals the callee's
# agent-dispatch-<run_id> or agent-dispatch-sweep: a caller and callee
# sharing a group deadlock, and GitHub fails the run as a workflow file
# issue with no jobs.
concurrency:
  group: >-
    ${{ github.event_name == 'issue_comment' && format('agent-dispatch-comment-{0}-{1}', github.repository, github.event.issue.number) ||
    (github.event_name == 'pull_request_target' && github.event.action != 'closed') && format('agent-dispatch-pr-{0}-{1}-{2}', github.repository, github.event.pull_request.number, github.event.action) ||
    format('agent-dispatch-stub-{0}', github.run_id) }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  dispatch:
    if: >-
      (github.event_name != 'issue_comment' ||
        ((startsWith(github.event.comment.body, 'park:') || startsWith(github.event.comment.body, 'opus-vet:')) &&
         (github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'))) &&
      (github.event_name != 'pull_request_target' ||
        (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository &&
          ((github.event.pull_request.merged == false && startsWith(github.event.pull_request.head.ref, 'claim/issue-')) ||
           (github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Revert "')))))
    uses: Nishfleet/fleet-ops/.github/workflows/agent-dispatch.yml@main
    permissions:
      issues: write
      pull-requests: write
      contents: write
      # The three read grants cap what the callee's jobs ask for: the sweep's
      # run liveness (`gh run view`) and the head's statusCheckRollup
      # (fleet-ops#8777), stuck-prs' head checks, hold-risky's statuses: read,
      # and orchestrate's actions: read daily-cap listing.
      actions: read
      checks: read
      statuses: read
    with:
      issue: ${{ inputs.issue }}
      agent_mode: ${{ vars.AGENT_MODE }}
      task: ${{ inputs.task }}
