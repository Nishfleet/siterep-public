name: answer
# A change request from the reviewer bot on an agent PR, or a failed CI run on an
# agent/issue-* PR, goes back to the fleet's worker lane, which lives in fleet-ops.
# The stub needs its own triggers, because "the github context is always associated
# with the caller workflow":
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
on:
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] nothing from the pull request is checked out or run
    workflows: [CI]
    types: [completed]
permissions: {}
jobs:
  answer:
    # Mirror the lane's own dispatch job (fleet-ops answer.yml): only a change request
    # on the head of an agent/issue-* PR, or a red CI run on that head, starts the lane.
    # The lane takes no inputs: as a called workflow it sees the caller's github context
    # and derives the issue from head_branch and the PR from pull_requests[0] itself.
    if: >-
      (github.event_name == 'pull_request_review' &&
        github.event.review.state == 'changes_requested' &&
        (github.event.review.user.login == 'nishfleet-approver' ||
          github.event.review.author_association == 'OWNER') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'agent/issue-')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'agent/issue-'))
    # The lane's job dispatches agent.yml on main with the issue and the PR. A called
    # workflow can only lower the caller's GITHUB_TOKEN permissions, never raise them.
    permissions: {actions: write}
    # @main, not a SHA, the same as the agent stub.
    uses: Nishfleet/fleet-ops/.github/workflows/answer.yml@main
