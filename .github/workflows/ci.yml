# The shared reusable-pr-checks workflow was deleted in fleet-ops #8954,
# so the verify steps live here now. Job id `verify` is the required check
# context in ruleset main-required-checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: |
          # No-glue regrowth gate (#109): zero helper scripts.
          test -z "$(git ls-files scripts bin tools ops .specify "*.sh")"
          npx playwright install chromium
          npm test
          npm run build
          npm run smoke:public-layout
          # Hermetic: route-mocks the whole /api/public/** surface; keeps the
          # Docs Mode install-flow gate from breaking while CI stays green.
          npm run smoke:widget-host
          # Walks the whole self-serve path on a throwaway local Worker: sign-up,
          # source crawl, widget install preview, first answer, lead in the
          # dashboard. Needs ./dist, and outbound HTTPS to example.com because
          # the real crawler blocks loopback hosts by design.
          npm run smoke:stranger-path
          # Wrangler version comes from the committed lockfile (4.120.0 pinned in
          # devDependencies), not npx's mutable cache: pulling the moving latest
          # tag broke every CI run repo-wide on 2026-08-11 (upstream publish E404).
          npm run cf:check
