name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Reports as `verify / PR checks`, the name the fleet-ops reusable gave it.
    name: verify / PR checks
    runs-on: ubuntu-latest
    # Observed ~1 minute with a warm npm cache, ~5 cold (run 32687009700,
    # 2026-08-24); 5 minutes bounds a stalled run.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (with npm cache)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: No-glue regrowth gate (#109)
        run: test -z "$(git ls-files scripts bin tools ops .specify "*.sh")"
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke public layout
        run: npm run smoke:public-layout
      - name: Smoke widget host
        run: npm run smoke:widget-host
      - name: Cloudflare deploy dry run
        run: npm run cf:check
