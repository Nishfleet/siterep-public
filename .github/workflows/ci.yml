# One CI file (fleet-ops#10935). Each job names the incident or rule that
# keeps it. Job names are the required check contexts on main.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Product tests, build and smokes. Lint is the comment ban (#155); the
  # empty scripts check is the no-glue gate (#109).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: |
          test -z "$(git ls-files scripts bin tools ops .specify "*.sh")"
          npx playwright install chromium
          npm test
          npm run build
          npm run smoke:public-layout
          npm run smoke:widget-host
          npm run smoke:stranger-path
          npm run cf:check

  # Owner acceptance (fleet-ops#10935): a Cloudflare Workers Preview of each
  # PR on preview-only storage, linked on the PR as a GitHub deployment
  # (wrangler-action's documented recipe). Forks and Dependabot get no deploy
  # token, so the job skips for them.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: preview --name pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      # A preview with no link is no preview: fail the check.
      - run: test -n "$PREVIEW_URL" && echo "Preview $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}

  # Secret scan of full history, so a key never sits in git: the fleet
  # already had a live token leak to rotate (fleet-ops#9578).
  Gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --verbose

  # No-glue standing rule (.semgrep/no-hand-built-orchestration.yml) plus the
  # p/default pack; fails on ERROR only (#236, #237).
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install semgrep==1.172.0
      - run: semgrep scan --config .semgrep/no-hand-built-orchestration.yml --config p/default --severity ERROR --error --metrics=off

  # Lints these workflow files; a broken workflow fails silently otherwise.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
