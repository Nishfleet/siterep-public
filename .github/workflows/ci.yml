name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Thin caller onto the fleet-ops reusable PR checks (fleet-ops#68). The
# reusable runs install + verify + secret scan in one batched job with a
# timeout, dependency caching and concurrency baked in. scan-secrets is off
# because this repo already runs its own required Gitleaks job
# (secret-scan.yml); turning it on would require branch protection to adopt
# the nested check name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Observed verify duration on ubuntu-latest is ~1 minute with a warm npm
    # cache, ~5 cold (run 32687009700, 2026-08-24: 61s end-to-end). 5 minutes
    # keeps the ~2-3x ratio against a cold-cache run while bounding the stall
    # class this repo hit before (queue-watchdog incident).
    uses: Nishfleet/fleet-ops/.github/workflows/reusable-pr-checks.yml@main
    with:
      node-version: "24"
      install-command: npm ci
      verify-command: |
        npx playwright install chromium
        npm test
        npm run build
        npm run smoke:public-layout
        npm run smoke:widget-host
        npm run cf:check
      scan-secrets: false
      timeout-minutes: 5