# A weekly SQL dump of this repository's D1 database, kept off Cloudflare
# (fleet-ops#10829).
#
# Time Travel covers the last 30 days and only goes back as far as the deploy's
# own bookmark. The weekly dump is the copy that survives everything else: a
# wrong restore, a deleted database, an account problem. It lands as an
# encrypted GitHub artifact on GitHub's storage, off the storage provider's and
# Cloudflare's accounts.
#
# The dump is sealed with age before upload: anyone with read access to this
# repository can download its workflow artifacts, so only the ciphertext leaves
# the runner. AGE_RECIPIENT below is the backup key's public half, never a
# secret and never the private key, which stays on the fleet host. It is a
# literal rather than a repository variable so this backup needs no GitHub
# settings change to start: rotating the key is a one-line edit in each of the
# repositories that hold this job. A run without a recipient fails loud on
# purpose: a backup that quietly shipped plaintext, or quietly shipped nothing,
# is the invisibility this job exists to end. The age release itself is
# digest-pinned.
#
# The dump goes through the stock D1 export API (`output_format: "polling"`,
# Cloudflare's OpenAPI schema): the first call starts the dump, later calls
# poll with the returned `at_bookmark` until `status: "complete"` carries a
# `signed_url`, valid one hour. The pinned cf CLI has no d1 export command, so
# this is the stock REST call, not hand-rolled backup logic.
#
# The matrix keeps the same shape as the other repositories that hold this job,
# with the one database this repository deploys: GitHub runs one job per
# database, so a refused database is that database's red job and never a
# cancelled sibling.
#
# Retention 90 days keeps 13 weekly points.
name: D1 weekly backup

on:
  schedule:
    # Mondays 05:37 UTC, the same minute as the sibling backups.
    - cron: "37 5 * * 1"
  workflow_dispatch: {} # a manual run for restore drills

concurrency:
  group: d1-export
  cancel-in-progress: false # a backup never kills a backup

permissions:
  contents: read

jobs:
  export:
    name: export ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # a database the API refuses costs the others nothing
      matrix:
        database:
          - name: siterep_payments
            id: ec176fc4-b4f2-44c0-a925-b36ec067cff5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f670a698e17bf160c8e4679823e68916
      AGE_RECIPIENT: age1650j6pxe55udk93gv3qsjeugfrdkhazc3ynpydjm64qm8k7fvvjqc093e4
      DB_NAME: ${{ matrix.database.name }}
      DB_ID: ${{ matrix.database.id }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install age, pinned by digest
        env:
          AGE_VERSION: v1.3.2
          AGE_LINUX_AMD64_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          node -e 'const fs=require("fs");const [,url,out]=process.argv;(async()=>{const r=await fetch(url);if(!r.ok){console.error("download: HTTP "+r.status);process.exit(1);}fs.writeFileSync(out,Buffer.from(await r.arrayBuffer()));})()' "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz" "$RUNNER_TEMP/age.tar.gz"
          echo "$AGE_LINUX_AMD64_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/age-bin"
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/age-bin" --strip-components=1 age/age
          test -x "$RUNNER_TEMP/age-bin/age"
      - name: Dump and seal ${{ matrix.database.name }}
        run: |
          test -n "$AGE_RECIPIENT" || { echo "::error::the age recipient is unset: AGE_RECIPIENT in .github/workflows/d1-export.yml must be the backup key's public key — the backup refuses to ship plaintext dumps"; exit 1; }
          mkdir -p "$RUNNER_TEMP/d1-export"
          file="$RUNNER_TEMP/d1-export/$DB_NAME-$(date -u +%Y%m%d).sql"
          headers="$RUNNER_TEMP/d1-headers"
          trap 'rm -f "$headers"' EXIT
          (umask 077 && printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" > "$headers")
          bookmark="" url=""
          for attempt in $(seq 1 20); do
            echo "poll $attempt for $DB_NAME"
            body='{"output_format":"polling"}'; [ -n "$bookmark" ] && body="{\"output_format\":\"polling\",\"current_bookmark\":\"$bookmark\"}"
            resp=$(curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors \
              -H "@$headers" -H 'content-type: application/json' -d "$body" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/export") \
              || { echo "::error::$DB_NAME export: the API call failed"; exit 1; }
            state=$(printf '%s' "$resp" | node -e '
              const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
              if (r.success !== true) { console.error("api: " + (r.errors?.[0]?.message ?? "not success")); process.exit(1); }
              const t = r.result ?? {};
              if (t.status === "error") { console.error("export: " + (t.error ?? "failed")); process.exit(1); }
              process.stdout.write(t.status === "complete" ? "done " + (t.result?.signed_url ?? "") : "wait " + (t.at_bookmark ?? ""));
            ') || { echo "::error::$DB_NAME export: the API answer is not a valid export response"; exit 1; }
            case "$state" in
              done\ *) url="${state#done }"; break ;;
              wait\ *) bookmark="${state#wait }" ;;
              *) echo "::error::$DB_NAME export: unreadable poll state"; exit 1 ;;
            esac
            sleep 15
          done
          test -n "$url" || { echo "::error::$DB_NAME export: no download URL after 20 polls"; exit 1; }
          # The signed URL's dump is data, not code: it is written to
          # $RUNNER_TEMP and shipped as an artifact, never executed, and it
          # changes every run so no digest can be pinned. The runtime's own
          # fetch (TLS, no shell quoting) takes it instead of curl.
          node -e 'const fs=require("fs");(async()=>{const r=await fetch(process.argv[1]);if(!r.ok){console.error("download: HTTP "+r.status);process.exit(1);}fs.writeFileSync(process.argv[2],Buffer.from(await r.arrayBuffer()));})()' "$url" "$file" \
            || { echo "::error::$DB_NAME export: the dump download failed"; exit 1; }
          echo "exported $DB_NAME -> ${file##*/} ($(wc -c < "$file") bytes, sha256 $(sha256sum "$file" | cut -d' ' -f1))"
          # Sealed before anything ships: only the .age ciphertext reaches the
          # artifact, and the plaintext dies with the runner's temp.
          "$RUNNER_TEMP/age-bin/age" -r "$AGE_RECIPIENT" -o "$file.age" "$file" \
            || { echo "::error::$DB_NAME export: the age encryption failed"; exit 1; }
          rm -f "$file"
          sha256sum "$RUNNER_TEMP/d1-export/"*.sql.age
      - name: Upload the sealed dump off Cloudflare
        # A job whose dump failed never reaches this step, so the failure is the
        # dump's own red job and never a silently empty artifact.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d1-backup-${{ matrix.database.name }}
          path: ${{ runner.temp }}/d1-export/*.sql.age
          retention-days: 90
          if-no-files-found: error
