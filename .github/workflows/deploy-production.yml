name: Deploy production
# Deploys each push to main, or by hand (fleet-ops#8615). The merge queue already
# ran the required CI checks on the exact commit that lands on main, so this
# workflow does not wait on a second CI run (no workflow_run trigger, zizmor
# dangerous-triggers). The production environment allows only main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://siterep.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # A job holding deploy secrets never restores the Actions cache (https://docs.zizmor.sh/audits/#cache-poisoning).
          package-manager-cache: false
      - run: npm ci
      - run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production serves this commit with storage ready
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 10 https://siterep.net/api/health/deep -o deep.json
          jq -e --arg sha "$GITHUB_SHA" '.ok and .release.source == "deploy-stamped" and .release.commit == $sha' deep.json
