name: Honesty check

# Scheduled only: the check reads the deployed worker and the live pricing
# catalog, so it stays off the PR gate. `npm test` runs the hermetic
# tests/honesty-check.test.js instead. A red run opens or updates an issue.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  honesty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: check
        run: |
          set -euo pipefail
          node --test tests/honesty-live.check.js 2>&1 | tee honesty.log
        continue-on-error: true
      - name: Open or update the failing-honesty issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The deployed honesty check is failing: a demo answer lost its citation, or the check could not read a fresh answer from the worker. Reproduce it with \`node --test tests/honesty-live.check.js\` against a preview host, fix the answer path in the worker, not the check, then close this issue."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            head -c 6000 honesty.log
            echo '```'
          } > body.md
          gh label create honesty-check-red -R "$GITHUB_REPOSITORY" --force --color D93F0B --description "The deployed honesty check is failing"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --label honesty-check-red --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label honesty-check-red --title "The deployed honesty check is failing" --body-file body.md
          fi
      - if: steps.check.outcome == 'failure'
        run: exit 1
