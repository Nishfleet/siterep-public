name: Lighthouse
# Audits the live page against the fleet speed budget after each production deploy, and weekly.
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  warm:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Warm the edge
        run: |
          for _ in 1 2 3 4 5 6; do
            page=$(curl -fsS -H 'accept-encoding: br' https://siterep.net/)
            asset=$(printf '%s' "$page" | grep -o '/assets/mount-[A-Za-z0-9_-]*\.js' | head -n 1)
            curl -fsS -H 'accept-encoding: br' -o /dev/null "https://siterep.net${asset}"
            curl -fsS -o /dev/null https://siterep.net/api/public/pricing
            sleep 2
          done
  lighthouse:
    needs: warm
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: Nishfleet/fleet-ops/.github/workflows/lighthouse.yml@main
    permissions:
      contents: read
    with:
      urls: |
        https://siterep.net/
