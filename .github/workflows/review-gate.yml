name: Review gate

# Thin caller for the rationed deep-review gate. The decision logic (risk
# classification + budget backpressure) lives in fleet-ops and is pinned by
# SHA; this file only owns the trigger and the per-repo cap. Bump the SHA
# deliberately via the weekly standards sync; never float to @main or @v1.
#
# Deep PR review is rationed: Greptile Starter gives ~50 reviews a month for
# the whole GitHub account. Reviews are opt-in via the `review:deep` label;
# the reusable workflow decides when to add it, with backpressure as the
# month's budget depletes. See docs/new-repo-bootstrap.md in fleet-ops.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review-gate:
    uses: Nishfleet/fleet-ops/.github/workflows/reusable-review-gate.yml@b7da3b8e717386a08a1188d3c2bf77d4af1c8810
    with:
      monthly-cap: "20"
