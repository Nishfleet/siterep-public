name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Same queue discipline as CI: one live scan per branch on the shared single
# VPS runner, superseded runs cancelled. Required-check stalls were silent
# for days because every push queued another scan behind a long backlog.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned binary + sha256)
        run: |
          set -euo pipefail
          # Pinned to an exact release tag and sha256 of the linux_x64
          # tarball from the official gitleaks/gitleaks releases. No
          # `latest` tags, no action wrapper, no license required.
          # Bump both GITLEAKS_VERSION and GITLEAKS_SHA256 together.
          GITLEAKS_VERSION="v8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          ARCHIVE="gitleaks_8.30.1_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}" "${URL}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          install -d "${HOME}/.local/bin"
          tar -xzf "${ARCHIVE}" -C "${HOME}/.local/bin" gitleaks
          chmod +x "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Scan repository
        # `gitleaks git` with no target scans the current working directory
        # as a git repo using `git log -p` (full history, matches
        # fetch-depth: 0). --redact hides any secret values from logs and
        # stdout (default 100%). Exit code is 1 on findings, 0 when clean.
        run: gitleaks git --redact --verbose
  semgrep:
    # Batched into the Secret Scan workflow per the CI standard's batching
    # preference: this file already runs on pull_request + push to main with
    # least-privilege permissions and per-branch concurrency, so a second
    # on:pull_request workflow would only double the queue on the shared
    # runner. The check context is the job name (`semgrep`), matching the
    # repo's existing bare-job-name contexts (Gitleaks, verify, classify).
    name: semgrep
    runs-on: ubuntu-latest
    # Observed local semgrep run on this repo is ~20-40s for both configs.
    # 10 minutes is ~3x a cold registry fetch + scan with headroom for the
    # shared-runner queue, bounding a real hang without flapping on normal
    # variance (same sizing discipline as the verify/gitleaks jobs).
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install semgrep (pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          # Pinned to an exact release (published 2026-07-28, >7 days old).
          # Bump deliberately; do not use `latest` or a floating range.
          pip install semgrep==1.172.0
      - name: Semgrep scan (repo gate + p/default)
        run: |
          set -uo pipefail
          # Both configs in one scan: the repo's no-hand-built-orchestration
          # gate (ERROR severity) and the Semgrep registry default pack for
          # defense-in-depth. The job fails only on ERROR/HIGH-tier findings
          # (semgrep's ERROR == HIGH, per the rule-syntax docs); lower-severity
          # p/default findings are reported but do not block, so pre-existing
          # MEDIUM/WARNING/INFO noise does not stall every PR.
          semgrep --config .semgrep/no-hand-built-orchestration.yml \
                  --config p/default \
                  --quiet --metrics=off --json > semgrep-results.json
          jq -r '.results[] | "::" + (.extra.severity | ascii_downcase) + "::" + .path + ":" + (.start.line|tostring) + " [" + .check_id + "] " + (.extra.message | gsub("\n";" "))' semgrep-results.json 2>/dev/null || true
          if jq -e '[.results[] | select(.extra.severity | ascii_downcase | IN("error","high"))] | length > 0' semgrep-results.json >/dev/null 2>&1; then
            echo "::error::Semgrep found ERROR/HIGH-severity findings (listed above)."
            exit 1
          fi
          echo "::notice::Semgrep clean (no ERROR/HIGH findings)."
      - name: Shell-line ratchet
        run: |
          set -uo pipefail
          # Counts hand-written shell lines: all *.sh/*.bash/*.bats files,
          # shell scripts directly under scripts/ (shebang-detected), and
          # `run: |` block body lines across .github/workflows/*.yml. The
          # baseline lives in .semgrep/shell-line-budget. CI fails if the
          # current count EXCEEDS the baseline; raising the baseline in the
          # same PR is the justification act (its diff line names the reason).
          current="$(python3 .semgrep/shell-line-count.py)"
          baseline="$(cat .semgrep/shell-line-budget)"
          echo "Current shell lines: $current"
          echo "Baseline:           $baseline"
          if [ "$current" -gt "$baseline" ]; then
            echo "::error::Shell-line budget exceeded: $current > $baseline. Raise .semgrep/shell-line-budget in this PR with a one-line justification naming the systemd feature/directive the new shell could not use."
            exit 1
          fi
          echo "::notice::Shell-line budget held: $current <= $baseline."
